name: Youtube New MindScribble Video

on:
  schedule:
    # Runs at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: true # CRITICAL: Ensures image and audio media files are fully pulled

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      cloudinary pillow numpy faster-whisper

      - name: Run Script
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python mindscribble_uploader.py

      - name: Commit updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add modified CSV first
          git add mind_scribble2.csv

          # Commit if changes exist
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update mind_scribble2.csv [posted state & last_image_index]"
            git pull origin main --rebase
            git push origin main
          else
            echo "No CSV changes to commit."
          fi