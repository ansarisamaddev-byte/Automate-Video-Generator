name: Youtube New MindScribble Video

on:
  schedule:
    # Runs at 12:00 UTC (8:00 AM New York EDT / UTC-4)
    # Change to '0 13 * * *' during Standard Time (EST / UTC-5)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1 
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      cloudinary pillow numpy faster-whisper

      - name: Run Script
        working-directory: mind_scribble
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # Add YouTube / Google Auth secrets here if required by your script:
          # YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python mindscribble_uploader.py

      - name: Commit updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Sync latest remote changes
          git pull origin main --rebase

          # Track the correct path to the CSV file inside mind_scribble/
          git add mind_scribble/data.csv
          
          # Commit and push only if changes exist
          git diff --staged --quiet || (git commit -m "Auto-update mind_scribble.csv [posted state & last_image_index]" && git push origin main)
