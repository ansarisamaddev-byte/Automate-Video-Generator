name: Youtube New MindScribble Video

on:
  schedule:
    # Intended: 8:00 AM New York | Runs early at 8:30 AM UTC
    - cron: '30 10 * * *'
  workflow_dispatch:
 
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1 
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      cloudinary pillow numpy faster-whisper

      - name: Run Script
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python mindscribble_uploader.py

      - name: Commit updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stash any local working directory edits
          git stash

          # Sync with repository head
          git pull origin main --rebase

          # Re-apply stashed changes
          git stash pop || echo "No stashed changes to re-apply"

          # Add and commit updated mind_scribble.csv
          git add data.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update mind_scribble.csv [posted state & last_image_index]"

          git push origin main