name: Youtube ColdCases Video

on:
  schedule:
    # 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
    # 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Match your project requirements
          pip install moviepy==2.2.1 
          pip install pandas google-api-python-client google-auth google-auth-oauthlib \
                      pillow numpy faster-whisper

      - name: Run Script
        env:
          # Add your Google/Cloudinary secrets here in GitHub Repository Settings
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python coldcases_uploader.py

      - name: Commit updated status
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Pull latest changes to avoid conflict
          git pull origin main --rebase

          # Add the file that tracks your video status
          git add coldcases.csv
          
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update: ColdCases posted status"

          git push origin main