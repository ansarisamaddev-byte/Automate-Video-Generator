name: Youtube MindScribble Comic
on:
  schedule:
    # Runs daily at 17:00 UTC (1:00 PM EST / 10:00 AM PST)
    # Target peak engagement hours: 2:00 PM - 4:00 PM EST
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history to support pushing state updates back to main

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & OpenCV runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 moviepy opencv-python numpy pillow faster-whisper

      - name: Run Video Generation & YouTube Upload
        env:
          # Stored in Repo Settings -> Secrets and variables -> Actions
          YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        run: |
          python mindscribble_comic.py

      - name: Commit and push updated JSON state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage changes in mind_scribble.json where posted status was updated
          git add mindscribble_podcaster/mind_scribble.json
          
          if git diff --staged --quiet; then
            echo "No changes in mind_scribble.json to commit."
          else
            git commit -m "auto: update posted status in mind_scribble.json [skip ci]"
            git push
          fi